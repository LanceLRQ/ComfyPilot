kind: recipe
id: minimax-h3-replacement
module_id: video-character-replacement
name: H3 单人视频替换
version: '0.1'
description: MiniMax H3 原生基础 R2V；单张人物参考图与一段已裁剪视频；生成音频，待完整生成验收。
