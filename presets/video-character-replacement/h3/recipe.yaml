input_order:
- video
- reference
inputs:
  video:
    kind: video
    bindings:
    - node_id: '200'
      input_name: file
  reference:
    kind: image
    bindings:
    - node_id: '137'
      input_name: image
parameters:
  prompt:
    type: string
    default: In <Video 1>, replace only the main foreground person with the person
      in <Picture 1>. Preserve the identity and clothing of <Picture 1>. Follow the
      movements, timing, body orientation and camera motion of <Video 1>. Preserve
      the other people, background, lighting and framing of <Video 1>. One continuous
      realistic shot, no cuts, no dialogue.
    bindings:
    - node_id: '138'
      input_name: value
  seed:
    type: integer
    default: 42
    bindings:
    - node_id: '129'
      input_name: noise_seed
    minimum: 0
    maximum: 9007199254740991
  width:
    type: integer
    default: 768
    bindings:
    - node_id: '136'
      input_name: width
    enum:
    - 768
  height:
    type: integer
    default: 448
    bindings:
    - node_id: '136'
      input_name: height
    enum:
    - 448
  length:
    type: integer
    default: 124
    bindings:
    - node_id: '136'
      input_name: length
    enum:
    - 124
  steps:
    type: integer
    default: 20
    bindings:
    - node_id: '124'
      input_name: steps
    enum:
    - 20
outputs:
  main:
    node_id: '92'
    key: images
    kind: video
